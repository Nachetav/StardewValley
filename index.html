<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Granja La Comarca - Inventario</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #f4e8c1; color: #4a2e10; padding: 20px; }
        h1 { text-align: center; border-bottom: 2px solid #8b5a2b; padding-bottom: 10px; }
        .item-card { background: #fff8e7; border: 2px solid #8b5a2b; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .precio { color: #d97706; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🌾 Granja "La Comarca" - Pueblo Pelícano</h1>
    <p>Inventario oficial de materiales y herramientas agrícolas.</p>

    <div class="item-card">
        <h3>🪓 Hacha de Cobre</h3>
        <p>Permite romper troncos grandes de madera en la granja.</p>
        <p class="precio">Precio: 2,000g</p>
    </div>

    <div class="item-card">
        <h3>🌽 Semillas de Maíz</h3>
        <p>Crecen durante las estaciones de verano y otoño.</p>
        <p class="precio">Precio: 50g</p>
    </div>
</body>
</html>
