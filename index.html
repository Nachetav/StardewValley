<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa - Granja La Comarca</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f7eed8;
            color: #4a2e1b;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            background-color: #e5be90;
            border: 3px solid #734128;
            border-radius: 8px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto 30px auto;
            box-shadow: 4px 4px 0px #734128;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        .container {
            max-width: 940px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            border-bottom: 2px dashed #734128;
            padding-bottom: 8px;
            font-size: 1.4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: #fff8eb;
            border: 2px solid #a66e4e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 3px 3px 0px #734128;
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .card h3 {
            margin: 10px 0 5px 0;
            font-size: 1.1rem;
        }

        .stock {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .precio {
            font-weight: bold;
            color: #d97706;
            margin: 5px 0 0 0;
        }

        .badge {
            display: inline-block;
            background-color: #734128;
            color: #fff8eb;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .card-gato {
            background-color: #fff3e0;
            border-color: #e65100;
        }

        .gato-title {
            color: #d84315;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🌾 Granja La Comarca</h1>
        <p>Vista previa del mercado e inventario sincronizado</p>
    </header>

    <main class="container">
        <section class="section">
            <h2 class="section-title">🛒 Productos A la Venta (Caja de Envíos)</h2>
            <div class="grid" id="catalogo-tienda"></div>
        </section>

        <section class="section">
            <h2 class="section-title">🎒 Inventario Personal y Mochila</h2>
            <div class="grid" id="lista-inventario"></div>
        </section>

        <section class="section">
            <h2 class="section-title">🐾 Mis Animales (Exhibición)</h2>
            <div class="grid" id="lista-animales"></div>
        </section>
    </main>

    <script>
        // DATOS DE PRUEBA INTEGRADOS (No requiere datos.json)
        const datosPrueba = {
            tienda: [
                { nombre: "Corn Seeds", cantidad: "5", precio: "50g" },
                { nombre: "Copper Axe", cantidad: "1", precio: "2000g" },
                { nombre: "Sweet Gem Berry", cantidad: "2", precio: "3000g" }
            ],
            mochila: [
                { nombre: "Wood", cantidad: "450" },
                { nombre: "Iron Pickaxe", cantidad: "1" },
                { nombre: "Fishing Rod", cantidad: "1" }
            ],
            animales: [
                { nombre: "pio", tipo: "Brown Chicken", icono: "🐣", descripcion: "Pollo watón café" },
                { nombre: "pia", tipo: "White Chicken", icono: "🐣", descripcion: "El pollo más ruidoso" },
                { nombre: "pie", tipo: "White Chicken", icono: "🐣", descripcion: "Pollo blanco" },
                { nombre: "shiro", tipo: "Cat", icono: "🐱", descripcion: "Guardián de los pollos" }
            ]
        };

        // RENDERIZAR TIENDA
        const contenedorTienda = document.getElementById('catalogo-tienda');
        datosPrueba.tienda.forEach(item => {
            contenedorTienda.innerHTML += `
                <div class="card">
                    <div class="card-icon">📦</div>
                    <h3>${item.nombre}</h3>
                    <p class="stock">Cantidad: ${item.cantidad}</p>
                    <p class="precio">Precio: ${item.precio}</p>
                </div>
            `;
        });

        // RENDERIZAR MOCHILA
        const contenedorInventario = document.getElementById('lista-inventario');
        datosPrueba.mochila.forEach(item => {
            contenedorInventario.innerHTML += `
                <div class="card">
                    <div class="card-icon">🎒</div>
                    <h3>${item.nombre}</h3>
                    <p class="stock">${item.cantidad} unidades</p>
                    <span class="badge">Mochila</span>
                </div>
            `;
        });

        // RENDERIZAR ANIMALES
        const contenedorAnimales = document.getElementById('lista-animales');
        datosPrueba.animales.forEach(animal => {
            const esGato = animal.tipo.includes('Cat');
            contenedorAnimales.innerHTML += `
                <div class="card ${esGato ? 'card-gato' : ''}">
                    <div class="card-icon">${animal.icono}</div>
                    <h3 class="${esGato ? 'gato-title' : ''}">${animal.nombre}</h3>
                    <p class="stock">${animal.descripcion}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
