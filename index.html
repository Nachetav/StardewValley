<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granja La Comarca - Sistema de Pestañas</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f7eed8;
            color: #4a2e1b;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            background-color: #e5be90;
            border: 3px solid #734128;
            border-radius: 8px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto 20px auto;
            box-shadow: 4px 4px 0px #734128;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        /* MENÚ DE NAVEGACIÓN */
        .nav-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto 30px auto;
        }

        .btn-tab {
            background-color: #e5be90;
            color: #4a2e1b;
            border: 2px solid #734128;
            border-radius: 6px;
            padding: 10px 16px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px #734128;
            transition: all 0.2s ease;
        }

        .btn-tab.active, .btn-tab:hover {
            background-color: #734128;
            color: #fff8eb;
            transform: translateY(-2px);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            border-bottom: 2px dashed #734128;
            padding-bottom: 8px;
            font-size: 1.4rem;
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: #fff8eb;
            border: 2px solid #a66e4e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 3px 3px 0px #734128;
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .card h3 {
            margin: 10px 0 5px 0;
            font-size: 1.1rem;
        }

        .info-text {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .precio {
            font-weight: bold;
            color: #d97706;
            margin: 5px 0 0 0;
        }

        .badge {
            display: inline-block;
            background-color: #734128;
            color: #fff8eb;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .card-gato {
            background-color: #fff3e0;
            border-color: #e65100;
        }

        .gato-title {
            color: #d84315;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🌾 Granja La Comarca</h1>
        <p>Panel de control e inventario general</p>
    </header>

    <!-- BARRA DE NAVEGACIÓN CON 6 BOTONES -->
    <nav class="nav-menu">
        <button class="btn-tab active" onclick="mostrarSeccion('tienda', this)">🛒 Tienda</button>
        <button class="btn-tab" onclick="mostrarSeccion('cofres', this)">📦 Cofres</button>
        <button class="btn-tab" onclick="mostrarSeccion('inventario', this)">🎒 Mochila</button>
        <button class="btn-tab" onclick="mostrarSeccion('animales', this)">🐾 Animales</button>
        <button class="btn-tab" onclick="mostrarSeccion('cultivos', this)">🌽 Cultivos</button>
        <button class="btn-tab" onclick="mostrarSeccion('peces', this)">🐟 Peces</button>
    </nav>

    <main class="container">
        <!-- SECCIÓN 1: TIENDA -->
        <section id="tienda" class="seccion-tab">
            <h2 class="section-title">🛒 Productos A la Venta</h2>
            <div class="grid" id="grid-tienda"></div>
        </section>

        <!-- SECCIÓN 2: COFRES -->
        <section id="cofres" class="seccion-tab" style="display: none;">
            <h2 class="section-title">📦 Almacenamiento en Cofres</h2>
            <div class="grid" id="grid-cofres"></div>
        </section>

        <!-- SECCIÓN 3: INVENTARIO MOCHILA -->
        <section id="inventario" class="seccion-tab" style="display: none;">
            <h2 class="section-title">🎒 Inventario Personal</h2>
            <div class="grid" id="grid-inventario"></div>
        </section>

        <!-- SECCIÓN 4: ANIMALES -->
        <section id="animales" class="seccion-tab" style="display: none;">
            <h2 class="section-title">🐾 Animales de la Granja</h2>
            <div class="grid" id="grid-animales"></div>
        </section>

        <!-- SECCIÓN 5: CULTIVOS -->
        <section id="cultivos" class="seccion-tab" style="display: none;">
            <h2 class="section-title">🌽 Cultivos en Crecimiento</h2>
            <div class="grid" id="grid-cultivos"></div>
        </section>

        <!-- SECCIÓN 6: PECES -->
        <section id="peces" class="seccion-tab" style="display: none;">
            <h2 class="section-title">🐟 Peces Capturados</h2>
            <div class="grid" id="grid-peces"></div>
        </section>
    </main>

    <script>
        // DATOS DE PRUEBA DE LAS 6 CATEGORÍAS
        const datosPrueba = {
            tienda: [
                { nombre: "Semillas de Maíz", cantidad: "5", precio: "50g", icono: "🌽" },
                { nombre: "Hacha de Cobre", cantidad: "1", precio: "2,000g", icono: "🪓" },
                { nombre: "Gema Dulce", cantidad: "2", precio: "3,000g", icono: "🍓" }
            ],
            cofres: [
                { nombre: "Madera", cantidad: "999", ubicacion: "Cofre Madera", icono: "🪵" },
                { nombre: "Piedra", cantidad: "500", ubicacion: "Cofre Cantera", icono: "🪨" },
                { nombre: "Lingote de Hierro", cantidad: "24", ubicacion: "Cofre Herrería", icono: "🪙" }
            ],
            inventario: [
                { nombre: "Picota de Hierro", cantidad: "1", icono: "⛏️" },
                { nombre: "Caña de Pescar", cantidad: "1", icono: "🎣" },
                { nombre: "Baya de Espezia", cantidad: "12", icono: "🍒" }
            ],
            animales: [
                { nombre: "pio", tipo: "Pollo café", icono: "🐣", desc: "Pollo watón café" },
                { nombre: "pia", tipo: "Pollo blanco", icono: "🐣", desc: "El pollo más ruidoso" },
                { nombre: "pie", tipo: "Pollo blanco", icono: "🐣", desc: "Un pollo adora caricias" },
                { nombre: "shiro", tipo: "Gato", icono: "🐱", desc: "Guardián de los pollos" }
            ],
            cultivos: [
                { nombre: "Tomate", dias: "Listos en 2 días", estado: "Regado", icono: "🍅" },
                { nombre: "Melón", dias: "Listo en 5 días", estado: "Regado", icono: "🍈" },
                { nombre: "Calabaza", dias: "Creciendo", estado: "Sin regar", icono: "🎃" }
            ],
            peces: [
                { nombre: "Trucha de río", tamaño: "24 pulgadas", calidad: "Oro", icono: "🐟" },
                { nombre: "Salmón", tamaño: "18 pulgadas", calidad: "Normal", icono: "🐠" },
                { nombre: "Pez Globo", tamaño: "10 pulgadas", calidad: "Iridio", icono: "🐡" }
            ]
        };

        // FUNCIÓN PARA CAMBIAR ENTRE PESTAÑAS
        function mostrarSeccion(idSeccion, boton) {
            document.querySelectorAll('.seccion-tab').forEach(sec => sec.style.display = 'none');
            document.querySelectorAll('.btn-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idSeccion).style.display = 'block';
            boton.classList.add('active');
        }

        // RENDERIZAR TODO AL CARGAR
        document.addEventListener('DOMContentLoaded', () => {
            // Tienda
            const gTienda = document.getElementById('grid-tienda');
            datosPrueba.tienda.forEach(i => {
                gTienda.innerHTML += `<div class="card"><div class="card-icon">${i.icono}</div><h3>${i.nombre}</h3><p class="info-text">Stock: ${i.cantidad}</p><p class="precio">Precio: ${i.precio}</p></div>`;
            });

            // Cofres
            const gCofres = document.getElementById('grid-cofres');
            datosPrueba.cofres.forEach(i => {
                gCofres.innerHTML += `<div class="card"><div class="card-icon">${i.icono}</div><h3>${i.nombre}</h3><p class="info-text">${i.cantidad} unidades</p><span class="badge">${i.ubicacion}</span></div>`;
            });

            // Inventario
            const gInv = document.getElementById('grid-inventario');
            datosPrueba.inventario.forEach(i => {
                gInv.innerHTML += `<div class="card"><div class="card-icon">${i.icono}</div><h3>${i.nombre}</h3><p class="info-text">Cantidad: ${i.cantidad}</p></div>`;
            });

            // Animales
            const gAni = document.getElementById('grid-animales');
            datosPrueba.animales.forEach(a => {
                const esGato = a.tipo === 'Gato';
                gAni.innerHTML += `<div class="card ${esGato ? 'card-gato' : ''}"><div class="card-icon">${a.icono}</div><h3 class="${esGato ? 'gato-title' : ''}">${a.nombre}</h3><p class="info-text">${a.desc}</p></div>`;
            });

            // Cultivos
            const gCul = document.getElementById('grid-cultivos');
            datosPrueba.cultivos.forEach(c => {
                gCul.innerHTML += `<div class="card"><div class="card-icon">${c.icono}</div><h3>${c.nombre}</h3><p class="info-text">${c.dias}</p><span class="badge">${c.estado}</span></div>`;
            });

            // Peces
            const gPec = document.getElementById('grid-peces');
            datosPrueba.peces.forEach(p => {
                gPec.innerHTML += `<div class="card"><div class="card-icon">${p.icono}</div><h3>${p.nombre}</h3><p class="info-text">Largo: ${p.tamaño}</p><p class="precio">Calidad: ${p.calidad}</p></div>`;
            });
        });
    </script>
</body>
</html>
